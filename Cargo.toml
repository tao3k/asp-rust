[workspace]

[package]
name = "rust-lang-project-harness"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
description = "Project-level Rust language harness with compact diagnostics for agents"
authors = ["CyberXiuXian Artisan workshop"]
readme = "README.md"
publish = []

[features]
cli = ["dep:blake3"]
default = ["search"]
search = []

[dependencies]
blake3 = { version = "1", optional = true }
cargo-lock = "11.0"
cargo_toml = "1.0.0"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syn = { version = "2", features = ["extra-traits", "full", "parsing", "visit"] }
toml = "1.1"

[dev-dependencies]
insta = "1"
rs-harness = { path = "rs-harness" }
tempfile = "3"

[[bin]]
name = "rs-harness"
path = "src/bin/rs-harness.rs"
required-features = ["cli"]

[[bench]]
name = "query_search_microbench"
path = "benches/query_search_microbench.rs"
required-features = ["search"]
