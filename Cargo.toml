[workspace]
members = [".", "build-support"]
resolver = "3"

[package]
name = "asp-rust"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
description = "ASP Rust language policy, evidence, and provider runtime"
authors = ["CyberXiuXian Artisan workshop"]
readme = "README.md"
publish = []

[features]
provider-server = [
    "dep:base64",
    "dep:tokio",
]
default = ["search"]
search = []

[dependencies]
base64 = { version = "0.22.1", optional = true }
blake3 = "1"
cargo-lock = "11.0"
cargo_toml = "1.0.0"
libc = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync"], optional = true }
syn = { version = "3.0.4", features = ["extra-traits", "full", "parsing", "visit"] }
toml = "1.1"

[dev-dependencies]
insta = "1"
tempfile = "3"

[build-dependencies]
asp-rust-build-support = { path = "build-support" }

[[bin]]
name = "asp-rust"
path = "src/bin/asp-rust.rs"
required-features = ["provider-server"]

[[bench]]
name = "query_search_microbench"
path = "benches/query_search_microbench.rs"
required-features = ["search"]
